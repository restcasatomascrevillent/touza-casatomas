<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: sin él, en iOS env(safe-area-inset-*) vale 0 y la
       barra fija "Llamar / Reservar" quedaba encima del indicador de inicio.
       Los márgenes laterales del notch en horizontal se compensan en
       index.css (body y elementos fijos con .safe-x). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="author" content="Touza Cocktail Bar" />
  <meta name="theme-color" content="#D4A574" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Los meta tags de SEO (title, description, canonical, Open Graph, Twitter,
       JSON-LD) los gestiona el componente <Seo /> por ruta vía vite-react-ssg
       y quedan prerenderizados en el HTML de cada página. No los dupliques aquí. -->

  <!-- Fonts - Optimized Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Sin JS, nada debe quedarse oculto esperando a React: las fotos diferidas
       (OptimizedImage arranca en opacity-0 hasta su onLoad) y los restos de
       `initial` de framer-motion que aún salen en línea en el HTML del SSG. -->
  <noscript>
    <style>
      img.opacity-0 { opacity: 1 !important; }
      .animate-pulse { display: none !important; }
      [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
